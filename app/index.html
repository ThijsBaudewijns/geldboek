<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Geldboek">
  <meta name="format-detection" content="telephone=no">
  <title>Geldboek</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar-title" id="view-title">Geldboek</h1>
    <a class="icon-btn" id="settings-link" href="#instellingen" aria-label="Instellingen">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M19.14 12.94a7.4 7.4 0 0 0 .05-.94 7.4 7.4 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.05.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
      </svg>
    </a>
  </header>

  <main class="main">
    <section class="gate-view" id="install-screen" hidden></section>
    <section class="gate-view" id="welcome-screen" hidden></section>
    <section class="view" id="view-invoer" data-view="invoer" data-title="Nieuwe uitgave" hidden></section>
    <section class="view" id="view-overzicht" data-view="overzicht" data-title="Overzicht" hidden></section>
    <section class="view" id="view-terugkijken" data-view="terugkijken" data-title="Terugkijken" hidden></section>
    <section class="view" id="view-reflectie" data-view="reflectie" data-title="Reflectie" hidden></section>
    <section class="view" id="view-instellingen" data-view="instellingen" data-title="Instellingen" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <nav class="tabbar" aria-label="Tabbladen">
    <a class="tab" href="#invoer" data-route="invoer">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      <span>Invoer</span>
    </a>
    <a class="tab" href="#overzicht" data-route="overzicht">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Overzicht</span>
    </a>
    <a class="tab" href="#terugkijken" data-route="terugkijken">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg>
      <span>Terugkijken</span>
    </a>
    <a class="tab" href="#reflectie" data-route="reflectie">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 20V12M12 20V5M19 20v-9"/></svg>
      <span>Reflectie</span>
    </a>
  </nav>

  <script src="js/store.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui-invoer.js"></script>
  <script src="js/ui-overzicht.js"></script>
  <script src="js/ui-instellingen.js"></script>
  <script src="js/ui-welkom.js"></script>
</body>
</html>
